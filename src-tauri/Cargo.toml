[package]
name = "ytm-desktop"
version = "0.2.0"
description = "YouTube Music 계정으로 쓰는 데스크톱 음악 플레이어 (맥·윈도우)"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ytm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8"
url = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# 맥 EQ: Core Audio 프로세스 탭(mac_tap.rs)
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSValue", "NSUUID", "NSDictionary"] }
rustfft = "6"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
