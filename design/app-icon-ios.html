<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0f0918}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 바탕: 밤 자주 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1742"/>
      <stop offset="1" stop-color="#0f0918"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#7b3ff2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7b3ff2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ff5a7a"/>
      <stop offset="1" stop-color="#7b3ff2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <!-- iOS 아이콘: 모서리는 iOS가 깎으므로 둥근 사각형(824) 안쪽 그림을 1024 정사각형 전체로 키운다(그림자·투명 여백 없음) -->
  <g transform="translate(-124.27 -124.27) scale(1.24272)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <circle cx="512" cy="530" r="262" fill="none" stroke="url(#ring)" stroke-width="44" opacity="0.55" filter="url(#soft)"/>
    <circle cx="512" cy="530" r="262" fill="none" stroke="url(#ring)" stroke-width="40"/>
    <g fill="url(#bar)">
      <rect x="363" y="508" width="42" height="122" rx="21"/>
      <rect x="427" y="420" width="42" height="210" rx="21"/>
      <rect x="491" y="362" width="42" height="268" rx="21"/>
      <rect x="555" y="446" width="42" height="184" rx="21"/>
      <rect x="619" y="532" width="42" height="98" rx="21"/>
    </g>
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
  </g>
</svg>
</body></html>
