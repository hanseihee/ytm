<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body>
<!-- 맥·윈도우 앱 아이콘. 그림은 app-icon-art.png(codex image_gen으로 만든 가장자리까지 꽉 찬 1024, 프롬프트는 app-icon-art.prompt.txt).
     앱 아이콘 격자(1024 캔버스에 824 둥근 사각형)에 맞춰 자르고 그림자를 단다.
     이 화면을 1024×1024 투명 배경으로 찍어 src-tauri/icons/app-icon.png로 두고 npm run icons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#d8142f"/>
  </g>
  <image href="app-icon-art.png" x="100" y="100" width="824" height="824" clip-path="url(#squircle)"/>
</svg>
</body></html>
